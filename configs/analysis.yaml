# configs/analysis.yaml
# Parametros centralizados para el pipeline de analisis

# Rutas (todas relativas a la raiz del repo, salvo overrides via env)
paths:
  # Bronze (raw)
  raw_csv: data/raw/danish_housing_prices.csv          # CSV de Kaggle (run_cleaning.py)
  raw_parquet: data/raw/DKHousingPrices.parquet        # Parquet original 1.2M (run_pipeline.py)

  # Silver
  processed_dir: data/processed/
  silver_parquet: data/processed/silver/danish_housing_clean.parquet
  bitacora_csv: data/processed/bitacora_limpieza.csv

  # Gold
  gold_dir: data/processed/gold/
  marts_dir: data/processed/tableau_marts/
  twbx_path: tableau/danish_housing_exploratorio.twbx

# Google Cloud Platform
gcp:
  project_id: project-43d6b6df-15b5-4496-a5e          # Override con env GCP_PROJECT
  buckets:
    bronze: danish-housing-bronze
    silver: danish-housing-silver
    gold: danish-housing-gold
  prefixes:
    bronze: raw/
    silver: processed/
    gold: marts/

# Dataset
dataset:
  kaggle_url: "https://www.kaggle.com/datasets/martinfrederiksen/danish-residential-housing-prices-1992-2024"
  date_column: date
  id_column: house_id

# Limpieza (reglas TB2)
cleaning:
  # P4: year_build atipico
  year_build_min: 1800

  # P5: Outliers en precios (multiplicador IQR)
  iqr_multiplier: 3.0
  price_columns:
    - purchase_price
    - sqm_price

  # P6: Periodo con menor completitud
  preliminary_period_before: 1995

  # P3: sales_type no clasificable
  invalid_sales_types:
    - "-"
    - "Familiehandel"

  # P7: zip_code string con 4 digitos
  zip_code_pad: 4

  # P8: Renombrar columnas macro con sufijo `%` (parquet de Kaggle) o `%25`
  # (CSV URL-encoded) al nombre canonico `_pct`. Ambas variantes incluidas
  # para tolerar cualquier procedencia del raw.
  column_renames:
    "nom_interest_rate%": nom_interest_rate_pct
    "nom_interest_rate%25": nom_interest_rate_pct
    "dk_ann_infl_rate%": dk_ann_infl_rate_pct
    "dk_ann_infl_rate%25": dk_ann_infl_rate_pct
    "yield_on_mortgage_credit_bonds%": yield_mortgage_bonds_pct
    "yield_on_mortgage_credit_bonds%25": yield_mortgage_bonds_pct
    "%_change_between_offer_and_purchase": pct_change_offer_purchase

# KPIs
kpis:
  # Precio Real: base del IPC
  cpi_base_year: 2024

  # Indice Regional: anio base
  index_base_year: 1992

  # Volatilidad: ventana movil en trimestres
  volatility_window_quarters: 4

  # Drawdown: periodos de crisis
  crisis_periods:
    - name: "Crisis financiera global"
      start: "2007-01-01"
      end: "2012-12-31"
    - name: "Burbuja inmobiliaria danesa"
      start: "2006-01-01"
      end: "2009-12-31"

# Filtros para analisis principal
filters:
  exclude_invalid_sales: true
  exclude_price_outliers: true
  include_preliminary_period: true

# Marts (generacion Gold)
marts:
  drawdown_min_obs: 5            # filtro n_transactions minimo por (region, house_type, quarter)
  min_price_real: 500            # piso para sqm_price_real (evita ruido de muestras minimas)
  bond_corr_window: 8            # ventana rolling para correlacion volumen-bonos

# Tipos de vivienda de interes
house_types:
  villa: "Villa"
  apartment: "Ejerlejlighed"
  summerhouse: "Fritidshus"
  terraced: "Raekke hus"

# Regiones
regions:
  capital: "Kobenhavn"
  provinces:
    - "Midtjylland"
    - "Nordjylland"
    - "Sjaelland"
    - "Syddanmark"