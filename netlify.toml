[[redirects]]
  from = "/"
  to = "/danish_housing_dashboard.html"
  status = 200

[[redirects]]
  # Servir los marts directo desde los CSV commiteados (data/marts/*.csv), sin depender de GCS.
  # Los marts estan git-tracked (ver .gitignore) y Netlify los publica -> no requiere GCP/auth.
  from = "/marts/*"
  to = "/data/marts/:splat"
  status = 200
