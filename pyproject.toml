[project]
name = "danish-housing-analysis"
version = "0.1.0"
description = "Analisis del mercado residencial danes 1992-2024 (UPC Data Visualization 2026-01)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Rody Vilchez", email = "rody.vilchez00@gmail.com" },
]

dependencies = [
    # Core
    "pandas>=2.1.0",
    "numpy>=2.4.6",
    "scipy>=1.11.0",
    "pyyaml>=6.0.0",
    "pyarrow>=15.0.0",  # parquet I/O

    # Kaggle dataset
    "mlcroissant>=0.0.13",
    "kaggle>=2.2.0",

    # Visualizacion
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",

    # Tableau export
    "tableauhyperapi>=0.0.19319",

    # GCP
    "google-cloud-storage>=2.10.0",

    # Modelado TB3
    "scikit-learn>=1.9.0",
    "xgboost>=2.0.0",
    "optuna>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.20",
    "black>=26.5.1",
    "mypy>=1.6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "jupyterlab>=4.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length (black-formatted)

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
