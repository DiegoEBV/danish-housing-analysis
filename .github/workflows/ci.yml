name: CI

on:
  pull_request:
  push:
    branches:
      - visualization
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-lint:
    name: Tests + Lint (uv)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync deps (frozen lockfile)
        run: uv sync --extra dev --frozen

      - name: Ruff (lint)
        run: uv run ruff check src/ scripts/ tests/

      - name: Pytest
        run: uv run pytest tests/ -v --tb=short

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (validate Dockerfile)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dh-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sanity: cargar la imagen y verificar que las deps importan.
      # Detecta bugs como el de `requirements.txt` stub que ya nos pico.
      - name: Smoke import-check
        run: |
          docker buildx build --load -t dh-pipeline:ci-smoke \
            --cache-from type=gha .
          docker run --rm dh-pipeline:ci-smoke python -c "
          import pandas, numpy, xgboost, sklearn, optuna, yaml
          from google.cloud import storage
          print('OK · pandas', pandas.__version__, '· xgboost', xgboost.__version__)
          "
