# configs/analysis.yaml
# Parámetros centralizados para el pipeline de análisis

# ── Rutas ────────────────────────────────────────────────────────────────────
paths:
  raw_data: data/raw/danish_housing_prices.csv
  processed_dir: data/processed/
  tableau_dir: data/processed/tableau_marts/

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  kaggle_url: "https://www.kaggle.com/datasets/martinfrederiksen/danish-residential-housing-prices-1992-2024"
  date_column: date
  id_column: house_id

# ── Limpieza (reglas TB2) ─────────────────────────────────────────────────────
cleaning:
  # P4: year_build atípico
  year_build_min: 1800

  # P5: Outliers en precios (multiplicador IQR)
  iqr_multiplier: 3.0
  price_columns:
    - purchase_price
    - sqm_price

  # P6: Período con menor completitud
  preliminary_period_before: 1995

  # P3: sales_type no clasificable
  invalid_sales_types:
    - "-"
    - "Familiehandel"   # ventas no de mercado

  # P7: zip_code → string con 4 dígitos
  zip_code_pad: 4

  # P8: Renombrar columnas con encoding %25
  column_renames:
    "nom_interest_rate%25": nom_interest_rate_pct
    "dk_ann_infl_rate%25": dk_ann_infl_rate_pct
    "yield_on_mortgage_credit_bonds%25": yield_mortgage_bonds_pct

# ── KPIs ──────────────────────────────────────────────────────────────────────
kpis:
  # Precio Real: base del IPC
  cpi_base_year: 2024

  # Índice Regional: año base
  index_base_year: 1992

  # Volatilidad: ventana móvil en trimestres
  volatility_window_quarters: 4

  # Drawdown: períodos de crisis a destacar
  crisis_periods:
    - name: "Crisis financiera global"
      start: "2007-01-01"
      end: "2012-12-31"
    - name: "Burbuja inmobiliaria danesa"
      start: "2006-01-01"
      end: "2009-12-31"

# ── Filtros para análisis principal ──────────────────────────────────────────
filters:
  # Excluir ventas no de mercado del análisis de precios
  exclude_invalid_sales: true
  # Excluir outliers de precio en análisis de tendencias
  exclude_price_outliers: true
  # Incluir período preliminar (con advertencia)
  include_preliminary_period: true

# ── Tipos de vivienda de interés ─────────────────────────────────────────────
house_types:
  villa: "Villa"
  apartment: "Ejerlejlighed"   # Apartamento en propiedad
  summerhouse: "Fritidshus"    # Casa de verano
  terraced: "Rækkehus"         # Casa adosada

# ── Regiones ─────────────────────────────────────────────────────────────────
regions:
  capital: "København"
  provinces:
    - "Midtjylland"
    - "Nordjylland"
    - "Sjælland"
    - "Syddanmark"
